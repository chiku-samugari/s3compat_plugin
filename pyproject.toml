[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "s3compat_plugin"
version = "0.1.0"
description = "S3 compatible storage integration for OSF"
readme = "README.md"
authors = ["Takehiko Nawata <samugari.penguin@gmail.com>"]
maintainers = ["Takehiko Nawata <samugari.penguin@gmail.com>"]
license = "Apache-2.0"
keywords = ["osf", "gravyvalet", "waterbutler", "s3", "storage", "addon"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
]
packages = [
    { include = "s3compat_plugin", from = "src" }
]
include = [
    { path = "src/s3compat_plugin/addon_imp/static", format = ["sdist", "wheel"] },
    { path = "src/s3compat_plugin/addon/static", format = ["sdist", "wheel"] },
    { path = "src/s3compat_plugin/addon/templates", format = ["sdist", "wheel"] },
    { path = "src/s3compat_plugin/addon/migrations", format = ["sdist", "wheel"] },
]

[tool.poetry.urls]
Homepage = "https://github.com/chiku-samugari/s3compat_plugin"
Documentation = "https://github.com/chiku-samugari/s3compat_plugin#readme"
Repository = "https://github.com/chiku-samugari/s3compat_plugin"
Issues = "https://github.com/chiku-samugari/s3compat_plugin/issues"
Changelog = "https://github.com/chiku-samugari/s3compat_plugin/blob/main/CHANGELOG.md"

[tool.poetry.dependencies]
python = ">=3.9"
django = ">=4.2"
boto3 = ">=1.28.0"
botocore = ">=1.31.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
pytest-django = ">=4.5.0"
pytest-cov = ">=4.0.0"
pytest-asyncio = ">=0.21.0"
black = ">=23.0.0"
ruff = ">=0.1.0"
mypy = ">=1.5.0"
pre-commit = ">=3.0.0"

[tool.poetry.group.docs.dependencies]
mkdocs = ">=1.5.0"
mkdocs-material = ">=9.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=s3compat_plugin",
    "--cov-report=term-missing",
    "--cov-report=html",
]
DJANGO_SETTINGS_MODULE = "tests.settings"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.ruff]
line-length = 100
target-version = "py39"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "migrations",
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
